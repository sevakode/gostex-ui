name: GOSTEX continuous releases
on:
  push:
    branches: [main]
    paths: ['native-launcher/**', '.github/workflows/gostex-release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build as the latest release
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: gostex-releases
  cancel-in-progress: false
  queue: max
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.8.2'
      - name: Monotonic development version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          # Reserve the earlier version codes, including installed local previews.
          Path('native-launcher/version.properties').write_text(f'code={100010 + run}\nname=0.33.{run}\n')
          PY
      - name: Restore release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.GOSTEX_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/gostex-release.pem"
      - name: Build Android with existing installation identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          export GOSTEX_ANDROID_KEYSTORE="$RUNNER_TEMP/gostex-android.keystore"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GOSTEX_ANDROID_KEYSTORE"
          chmod 600 "$GOSTEX_ANDROID_KEYSTORE"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.2' 'build-tools;36.0.0'
          gradle -p native-launcher --no-daemon :release-runtime:test :app:assembleRelease :app:lintRelease
          actual_min_sdk=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging native-launcher/app/build/outputs/apk/release/app-release.apk | sed -n "s/^sdkVersion:'\([0-9]*\)'$/\1/p")
          test "$actual_min_sdk" = 28
          # Host checks are independent and use separate temporary directories.
          # Two workers fit the hosted runner; xargs fails the build if any check fails.
          printf '%s\n' \
            native-launcher/checks/check_release_boundary.py \
            native-launcher/checks/check_translations.py \
            native-launcher/checks/check_archive_admission.py \
            native-launcher/checks/check_library_snapshot.py \
            native-launcher/checks/check_import_warnings.py \
            native-launcher/checks/check_remote_install_policy.py \
            native-launcher/checks/check_legacy_catalog_bridge.py \
            native-launcher/checks/check_legacy_catalog_archive.py \
            native-launcher/checks/check_legacy_catalog_recovery.py \
            native-launcher/checks/check_legacy_recovery_state.py \
            native-launcher/checks/check_cover_concurrency.py \
            native-launcher/checks/check_media_file_labels.py \
            native-launcher/checks/check_episode_file_suggestion.py \
            native-launcher/checks/check_torr_playback_logic.py \
            native-launcher/checks/check_torr_prefetch_plan.py \
            native-launcher/checks/check_torr_store_race.py \
            native-launcher/checks/check_torr_download.py \
            native-launcher/checks/check_video_resume_logic.py \
            native-launcher/checks/check_torr_playlist_safety.py \
            native-launcher/checks/check_episode_history.py \
            native-launcher/checks/check_movie_torrent_links.py \
            native-launcher/checks/check_episode_receipt.py \
            native-launcher/checks/check_media_cover_retry.py \
            native-launcher/checks/check_movie_addon_lookup.py \
            native-launcher/checks/test_public_release.py \
            native-launcher/checks/test_carry_forward_linux.py \
            native-launcher/checks/check_update_state.py \
            native-launcher/checks/check_install_session.py | xargs -n 1 -P 2 python3
          actual_certificate=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs native-launcher/app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual_certificate" = '8dfd10419f9cd24209f4771e083cd33c4fd78375e6b19aea0453257be1016898'
          python3 native-launcher/tools/release/publish_feed.py --platform android-arm64 --artifact native-launcher/app/build/outputs/apk/release/app-release.apk --output release-assets --private-key "$RUNNER_TEMP/gostex-release.pem" --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/build-$GITHUB_RUN_NUMBER"
      # A workflow artifact is also a distribution channel. Never upload an
      # unchecked APK, even when no GitHub Release is being published.
      - name: Check candidate before any artifact upload
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 native-launcher/checks/check_public_release.py --apk release-assets/gostex-android-arm64-*.apk
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: release-android-arm64
          path: release-assets/*
          if-no-files-found: error
  publish:
    # Normal pushes only build and validate. Publishing updates the live feed,
    # so it requires a separate explicit workflow dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-android-arm64
          path: release-assets
      - name: Block known private content in public APK
        run: |
          python3 native-launcher/checks/test_public_release.py
          python3 native-launcher/checks/check_public_release.py --apk release-assets/gostex-android-arm64-*.apk
      - name: Preserve the current Linux channel unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous_tag=$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName)
          [[ "$previous_tag" =~ ^build-[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/prior-linux"
          gh release download "$previous_tag" --repo "$GH_REPO" --dir "$RUNNER_TEMP/prior-linux" \
            --pattern 'linux-x64.properties*' --pattern 'gostex-linux-x64-*.zip' \
            --pattern 'bootstrap.py' --pattern 'gostex-install.py' --pattern 'gostex-deck-install.py' --pattern 'gostex.svg'
          python3 native-launcher/tools/release/carry_forward_linux.py --source "$RUNNER_TEMP/prior-linux" --destination release-assets --repo "$GH_REPO" --source-tag "$previous_tag"
          printf '%s' "$previous_tag" > "$RUNNER_TEMP/previous-release-tag"
      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous_tag=$(cat "$RUNNER_TEMP/previous-release-tag")
          test "$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName)" = "$previous_tag"
          [[ "$previous_tag" =~ ^build-[0-9]+$ && "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ ]]
          # Queue start order is not guaranteed. An older build remains available,
          # but must never replace a newer update feed as the latest release.
          latest=false
          if (( 10#$GITHUB_RUN_NUMBER > 10#${previous_tag#build-} )); then latest=true; fi
          printf '%s\n' 'GOSTEX Android TV update. The previous Linux release assets are retained unchanged.' '' 'Android uses system installation confirmation.' > "$RUNNER_TEMP/release-body.md"
          gh release create "build-$GITHUB_RUN_NUMBER" release-assets/* --target "$GITHUB_SHA" --title "GOSTEX 0.33.$GITHUB_RUN_NUMBER" --notes-file "$RUNNER_TEMP/release-body.md" --latest="$latest"
